name: 打包财务助手Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包成EXE
        run: |
          pyinstaller --onefile --console --name=财务助手 main.py

      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: 财务助手_Windows版
          path: dist/财务助手.exe
